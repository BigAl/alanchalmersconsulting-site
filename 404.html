<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Alan Chalmers Consulting</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
        :root { --bg: #f6f5f0; --text: #1c1c18; --muted: #5c5c55; --accent: #1f5c3a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: grid; place-items: center;
            padding: 2rem 1.25rem; line-height: 1.65;
        }
        main { max-width: 480px; }
        .code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; }
        h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.15; margin: 0.75rem 0 1rem; }
        h1 em { color: var(--accent); }
        p { color: var(--muted); }
        ul { list-style: none; margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
        a { color: var(--accent); font-weight: 500; text-underline-offset: 3px; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    </style>
</head>
<body>
<main>
    <p class="code">404</p>
    <h1>That page <em>isn't here.</em></h1>
    <p>The link may be old or mistyped. Try one of these instead:</p>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/benchboss/">BenchBoss</a></li>
        <li><a href="/benchboss/privacy/">BenchBoss privacy policy</a></li>
    </ul>
</main>
</body>
</html>
